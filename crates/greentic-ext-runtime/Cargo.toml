[package]
name = "greentic-ext-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wasmtime-based runtime for Greentic Designer Extensions"

[features]
default = []
# Honors the `GREENTIC_EXT_ALLOW_UNSIGNED=1` env var to bypass signature
# verification. Off by default so production builds always verify; enable
# only in dev/test toolchains and CI fixtures.
dev-allow-unsigned = []

[dependencies]
greentic-extension-sdk-contract = "=1.3.0-research.5"
# Reused for `trust_store::TrustStore` — the TOFU publisher-key anchor the
# verify chain pins against. Deliberately reused rather than ported: the SDK's
# store already carries the file-locking + atomic-rename care this needs, and
# relocating it to `-contract` would require a new SDK tag plus a version bump
# in every consumer. Compile-time weight only.
greentic-extension-sdk-registry = "=1.3.0-research.5"
greentic-types = { workspace = true }

[dependencies.directories]
workspace = true

# Both are needed to parse the publisher key out of a signed describe and check
# the signature against it (anchored verify). Previously dev-only.
[dependencies.base64]
workspace = true

[dependencies.ed25519-dalek]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.arc-swap]
workspace = true

[dependencies.notify]
workspace = true

[dependencies.notify-debouncer-full]
workspace = true

[dependencies.semver]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.wasmtime]
workspace = true

[dependencies.wasmtime-wasi]
workspace = true

[dependencies.reqwest]
workspace = true
features = ["blocking", "rustls-tls", "json"]
default-features = false

[dependencies.url]
version = "2"

[dependencies.async-trait]
workspace = true

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
greentic-extension-sdk-testing = "=1.3.0-research.5"
wat = "1"

[dev-dependencies.wiremock]
version = "0.6"

[dev-dependencies.ed25519-dalek]
workspace = true

[dev-dependencies.rand]
workspace = true

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.tokio]
workspace = true

[dev-dependencies.tracing-subscriber]
workspace = true

[dev-dependencies.serde_jcs]
workspace = true

[dev-dependencies.sha2]
workspace = true

[lints]
workspace = true

[dev-dependencies.directories]
workspace = true
